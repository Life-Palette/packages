name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @life-palette/uploader exec playwright install --with-deps chromium
      - run: pnpm --filter @life-palette/uploader test:browser
      - run: pnpm build
      - run: pnpm --filter @life-palette/playground-web build
      - run: pnpm --filter @life-palette/uploader-uniapp typecheck
      - run: pnpm --filter @life-palette/playground-uniapp type-check
      - run: pnpm --filter @life-palette/playground-uniapp build:h5
      - run: pnpm --filter @life-palette/playground-uniapp build:mp-weixin
      - run: pnpm --filter @life-palette/docs build
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
