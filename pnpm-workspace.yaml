packages:
  - "packages/*"
  - "apps/*"
  - "apps/playground/*"
nodeLinker: isolated
overrides:
  # Local validation of the unpublished mini-program entry; no registry release.
  metaprobe: link:../metaprobe
verifyDepsBeforeRun: false
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.13'
  - '@biomejs/cli-darwin-arm64@2.5.13'
  - '@biomejs/cli-darwin-x64@2.5.13'
  - '@biomejs/cli-linux-arm64-musl@2.5.13'
  - '@biomejs/cli-linux-arm64@2.5.13'
  - '@biomejs/cli-linux-x64-musl@2.5.13'
  - '@biomejs/cli-linux-x64@2.5.13'
  - '@biomejs/cli-win32-arm64@2.5.13'
  - '@biomejs/cli-win32-x64@2.5.13'
  - vite@8.3.0
